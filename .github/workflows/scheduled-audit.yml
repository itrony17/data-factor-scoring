name: Scheduled audit

# Weekly smoke audit: lint + tests against the latest main.
# Keeps a steady maintenance signal and catches regressions introduced
# by the environment (fresh pins, runner images) rather than by code.

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    name: audit (py3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff pytest

      - name: Lint
        run: python -m ruff check src tests

      - name: Tests
        run: python -m pytest -q
