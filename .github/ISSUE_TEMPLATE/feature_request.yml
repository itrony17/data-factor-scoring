name: Feature request
description: Suggest an improvement to DQFS factors, reports or workflow.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? CLI examples or YAML snippets welcome.
      placeholder: dqfs score --parquet data.parquet --config dqfs.yaml
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or tools you have used for this.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement or test this change.
  - type: checkboxes
    id: roadmap-check
    attributes:
      label: Roadmap check
      description: Please skim ROADMAP.md first — if the idea is listed there, comment on it instead.
      options:
        - label: I checked ROADMAP.md and this is not already planned.
