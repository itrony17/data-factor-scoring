[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dqfs"
version = "1.1.0"
description = "DQFS - Data Quality Factor Scoring: a deep-ML CLI pipeline that scores dataset quality factors, applies pass/fail gates and publishes results to GitHub."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DQFS Contributors" }]
keywords = ["data-quality", "factor-scoring", "machine-learning", "tabular", "deep-learning", "github"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Database",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "sqlalchemy>=2.0",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "requests>=2.28",
    "python-json-logger>=3.1",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-requests>=2.31",
    "pip-audit>=2.7",
]

[project.scripts]
dqfs = "dqfs.cli:main"

[project.urls]
Homepage = "https://github.com/itrony17/data-factor-scoring"
Documentation = "https://github.com/itrony17/data-factor-scoring#readme"
Changelog = "https://github.com/itrony17/data-factor-scoring/blob/main/CHANGELOG.md"
"Contributing" = "https://github.com/itrony17/data-factor-scoring/blob/main/CONTRIBUTING.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src/dqfs --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["src/dqfs"]
branch = true
omit = ["src/dqfs/__main__.py"]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]

[tool.mypy]
python_version = "3.10"
files = ["src/dqfs"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_site_packages = false

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "numpy.*",
    "sqlalchemy.*",
    "yaml.*",
    "openpyxl.*",
    "pythonjsonlogger.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["N806"]
