[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dqfs"
version = "1.0.0"
description = "DQFS - Data Quality Factor Scoring: a deep-ML CLI pipeline that scores dataset quality factors, applies pass/fail gates and publishes results to GitHub."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DQFS Contributors" }]
keywords = ["data-quality", "factor-scoring", "machine-learning", "tabular", "deep-learning", "github"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Database",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "sqlalchemy>=2.0",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "requests>=2.28",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
dqfs = "dqfs.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/data-factor-scoring"
Documentation = "https://github.com/your-org/data-factor-scoring#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["N806"]
